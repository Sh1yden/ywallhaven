name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run shared tests
        run: uv run --frozen pytest -m "not native"

      - name: Run Linux native tests
        if: runner.os == 'Linux'
        run: uv run --frozen pytest -m "native_linux"

      - name: Run Windows native tests
        if: runner.os == 'Windows'
        run: uv run --frozen pytest -m "native_win"
