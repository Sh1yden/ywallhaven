[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "ywallhaven"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flet[all]>=0.86.4",
    "httpx>=0.28.1",
    "packaging>=24.0",
    "pydantic-settings>=2.14.2",
    "pyinstaller>=6.21.0",
    "pillow>=11.0.0",
]

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "hatch-vcs>=0.4.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

[tool.pytest.ini_options]
asyncio_mode = "auto"
